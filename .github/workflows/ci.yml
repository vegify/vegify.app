name: ci

# Build + test on every push to main and on PRs. NO deploy — production ships ONLY through the
# release pipeline (release.yml; decision A, 2026-06-26). This is also what gives PRs status checks.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # PR pushes share a group (a new push cancels the stale run — latest wins). Main pushes get a UNIQUE
  # group per run (github.run_id), so concurrency is a no-op on main: every merged commit's CI runs to
  # completion and is never cancelled by the next merge (each main commit is a permanent state to
  # verify). Rapidly merging a stack no longer cancels the earlier commits' checks.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just
      - name: Test the server + shared core (native — the GUI crate is covered in release.yml)
        run: just rust-core

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: pnpm
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just
      - run: pnpm install --frozen-lockfile
      # Each step is a `just` recipe — the SAME commands `just check` runs locally, so dev and CI
      # share one source (the justfile) and can't drift (the failure that motivated this).
      - name: Lint (biome)
        run: just lint
      - name: Build design tokens (theme.css is gitignored)
        run: just tokens
      - name: Typecheck
        run: just typecheck
      - name: Web unit tests
        run: just web-test
      - name: Build the web + desktop frontends
        run: just build

  unused-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
      - run: pnpm install --frozen-lockfile
      - run: cargo install cargo-machete
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just
      - name: Unused-dependency check (knip + cargo-machete)
        run: just unused-deps

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
